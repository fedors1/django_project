<!DOCTYPE html>
{% extends 'blogs/base.html' %}
{% block content %}
    <div class="row text-center">
        <div class="col-3">
            <div class="card mb-4 box-shadow">
                <div class="card-header">
                    <h4 class="my-0 font-weight-normal">{{ blog.header }}</h4>
                </div>
                <div class="card-body">
                    <h1 class="card-title pricing-card-title"></h1>
                    <ul class="list-unstyled mt-3 mb-4 text-start m-3">
                        <img src="{{ blog.preview }}">
                        <li>- {{ blog.description|truncatechars:100 }}</li>
                        <li>- {{ blog.created_at|date:"d.M.Y" }}</li>
                    </ul>
                    <a class="btn btn-lg btn-block btn-outline-primary" href="{% url 'blog:blog_list' %}">Назад</a>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
