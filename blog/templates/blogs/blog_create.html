<!DOCTYPE html>
{% extends 'blogs/base.html' %}
{% block content %}
    <div class="row text-center">
        <div class="col-3">
            <div class="card mb-4 box-shadow">
                <div class="card-header">
                    <h4 class="my-0 font-weight-normal">{{ blog.header }}</h4>
                </div>
                    <form class="row" method="post">
                        <div class="card-body">
                            {% csrf_token %}
                            {{ form.as_p }}
                        </div>
                    <button class="btn btn-lg btn-block btn-outline-primary" type="submit">
                        {% if blog %}
                        Сохранить
                        {% else %}
                        Создать
                        {% endif %}
                    </button>
                    </form>
                    <a class="btn btn-lg btn-block btn-outline-primary" href="{% url 'blog:blog_list' %}">Назад</a>
                </div>
            </div>
        </div>
{% endblock %}
