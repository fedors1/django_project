<!DOCTYPE html>
{% extends 'blogs/base.html' %}
{% load static %}
{% block content %}
{% include 'blogs/includes/base_blog_menu.html' %}
<div class="container">
    <div class="row text-center">
        {% for blog in blogs %}
            <div class="col-sm-6 col-md-4 col-lg-3 mb-4">
                <div class="card box-shadow h-100">
                    <div class="card-header">
                        <h4 class="my-0 font-weight-normal">{{ blog.header }}</h4>
                    </div>
                    <div class="card-body d-flex flex-column">
                        <h1 class="card-title pricing-card-title">{{ blog.description }}</h1>
                        <p class="card-title pricing-card-title">Количество просмотров: {{ blog.views_counter }}</p>
                        <ul class="list-unstyled mt-3 mb-4 text-start m-3">
                        </ul>
                        <a href="{% url 'blog:blog_detail' blog.pk %}" class="btn btn-lg btn-block btn-outline-primary mt-auto">Посмотреть</a>
                        <a href="{% url 'blog:blog_update' blog.pk %}" class="btn btn-lg btn-block btn-outline-primary mt-auto">Редактировать</a>
                        <a href="{% url 'blog:blog_confirm_delete' blog.pk %}" class="btn btn-lg btn-block btn-outline-danger mt-auto">Удалить</a>
                    </div>
                </div>
            </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
