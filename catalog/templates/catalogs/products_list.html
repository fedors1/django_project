<!DOCTYPE html>
{% extends 'catalogs/base.html' %}
{% load my_tags %}
{% load static %}
{% block content %}
{% include 'includes/base_product_menu.html' %}
<div class="container">
    <div class="row text-center">
        {% for product in products %}
            <div class="col-sm-6 col-md-4 col-lg-3 mb-4">
                <div class="card box-shadow h-100">
                    <div class="card-header">
                        <h4 class="my-0 font-weight-normal">{{ product.name }}</h4>
                    </div>
                    <div class="card-body d-flex flex-column">
                        <img src="{{ product.image | media_filter }}">
                        <h1 class="card-title pricing-card-title">{{ product.price }} р.</h1>
                        <ul class="list-unstyled mt-3 mb-4 text-start m-3">
                        </ul>
                        <a href="{% url 'catalog:product_detail' product.pk %}" class="btn btn-lg btn-block btn-outline-primary mt-auto">Подробнее</a>
                    </div>
                </div>
            </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
